<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>openmakeup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a neutral grey shade-card counter. The app shell is a left rail when the frame is >= 900px wide and a bottom tab bar below that; swatches carry all the colour, ink-blue is the consultant's pen. */
:root {
  --paper: #f1f1f0;        /* grey card: neutral so swatches read true */
  --sheet: #ffffff;        /* only for things that must stand apart: sheets, cards you tap */
  --ink: #1a191b;
  --ink-2: #56545a;
  --ink-3: #85838a;
  --rule: #dad9d9;
  --fill: #e7e6e5;
  --stage: #e3e2e0;        /* face illustration backdrop */
  --hair-base: #1c1b1d; --hair: var(--hair-base); --face-white: #fbf6f3;  /* face drawing: hair (set from the profile), eye white */
  --accent: #2b3fb8;       /* ink blue: no swatch is ever this hue */
  --accent-ink: #ffffff;
  --accent-soft: #e4e7f8;
  --skin: #dfb593;
  --ok: #1c7647;   --ok-bg: #dff0e5;
  --warn: #8f5c08; --warn-bg: #f6ead2;
  --bad: #b0281f;  --bad-bg: #f8e1de;
  --scrim: rgba(16, 16, 20, .4);
  --lift: 0 1px 2px rgba(20, 20, 30, .05), 0 10px 30px rgba(20, 20, 30, .10);

  --f-display: "Archivo", "Be Vietnam Pro", "Apple SD Gothic Neo", "Noto Sans KR", "PingFang SC", system-ui, sans-serif;
  --f-body: "Be Vietnam Pro", "Apple SD Gothic Neo", "Noto Sans KR", "PingFang SC", "Hiragino Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --t-xs: .75rem; --t-sm: .8125rem; --t-base: .9375rem; --t-md: 1.0625rem; --t-lg: 1.3125rem; --t-xl: 1.75rem; --t-2xl: 2.375rem;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131314; --sheet: #1c1c1f; --ink: #ececed; --ink-2: #a8a6ac; --ink-3: #7d7b81; --rule: #2e2d31; --fill: #252427; --stage: #2a292c;
    --hair: color-mix(in srgb, var(--hair-base) 55%, #000); --face-white: #efe6e2;
    --accent: #9eabff; --accent-ink: #0f1442; --accent-soft: #22284a;
    --ok: #6ccf96; --ok-bg: #14281c; --warn: #e2b65a; --warn-bg: #2d2412; --bad: #f2867c; --bad-bg: #351b19;
    --scrim: rgba(0, 0, 0, .55); --lift: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131314; --sheet: #1c1c1f; --ink: #ececed; --ink-2: #a8a6ac; --ink-3: #7d7b81; --rule: #2e2d31; --fill: #252427; --stage: #2a292c;
  --hair: color-mix(in srgb, var(--hair-base) 55%, #000); --face-white: #efe6e2;
  --accent: #9eabff; --accent-ink: #0f1442; --accent-soft: #22284a;
  --ok: #6ccf96; --ok-bg: #14281c; --warn: #e2b65a; --warn-bg: #2d2412; --bad: #f2867c; --bad-bg: #351b19;
  --scrim: rgba(0, 0, 0, .55); --lift: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 400 var(--t-base)/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p, ul, ol, dl, dd, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
h1, h2, h3 { text-wrap: balance; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
[hidden] { display: none !important; }
code, .mono { font-family: var(--f-mono); font-size: .92em; font-variant-numeric: tabular-nums; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* The app fills the window; the container query below picks the rail or the tab bar from the width of this frame. */
html, body, .frame { height: 100%; }
.frame { container: app / inline-size; overflow: hidden; background: var(--paper); }

/* ---------- app shell ---------- */
.app { position: relative; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--paper); overflow: hidden; }
.rail { display: none; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--rule); background: var(--paper); }
.wordmark { border: 0; background: none; padding: 0; font: 760 1.05rem/1 var(--f-display); font-stretch: 122%; letter-spacing: -.01em; color: var(--ink); white-space: nowrap; }
.wordmark span { font: 500 .72rem/1 var(--f-mono); letter-spacing: 0; color: var(--ink-3); margin-left: 4px; vertical-align: 2px; }
.tb-right { display: flex; align-items: center; gap: 4px; }
.me { display: flex; align-items: center; gap: 7px; border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 4px 10px 4px 4px; font-size: var(--t-xs); font-weight: 600; white-space: nowrap; }
.me i, .rail-me i { width: 22px; height: 22px; border-radius: 50%; background: var(--skin); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1); }
.me[aria-current="page"] { border-color: var(--accent); color: var(--accent); }
.icon-btn { position: relative; width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: transparent; border-radius: 8px; color: var(--ink); }
.icon-btn:hover { background: var(--fill); }
.badge { min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font: 600 10.5px/17px var(--f-body); text-align: center; }
.icon-btn .badge { position: absolute; top: 3px; right: 1px; }
.main { overflow-y: auto; overflow-x: hidden; min-height: 0; overscroll-behavior: contain; scroll-behavior: auto; }
.tabbar { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: end; background: var(--sheet); border-top: 1px solid var(--rule); padding: 4px 4px calc(8px + env(safe-area-inset-bottom, 0px)); }
.tab { display: grid; justify-items: center; gap: 2px; border: 0; background: none; color: var(--ink-3); font-size: 11px; font-weight: 500; padding: 6px 0 2px; }
.tab svg.i { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab.check { color: var(--ink); }
.tab.check .disc { width: 50px; height: 50px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; margin-top: -22px; box-shadow: 0 0 0 5px var(--sheet), 0 6px 14px rgba(43, 63, 184, .35); }
.tab.check .disc svg.i { width: 24px; height: 24px; }

@container app (min-width: 900px) {
  .app { grid-template-rows: minmax(0, 1fr); grid-template-columns: 248px minmax(0, 1fr); }
  .topbar, .tabbar { display: none; }
  .rail { display: flex; flex-direction: column; gap: 22px; padding: 26px 16px 18px; border-right: 1px solid var(--rule); background: var(--paper); min-height: 0; }
  .rail .wordmark { font-size: 1.25rem; padding-left: 8px; }
  .rail-check { width: 100%; justify-content: center; padding-block: 11px; }
  .rail-nav { display: grid; gap: 2px; }
  .rail-item { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; padding: 9px 10px; border-radius: 7px; color: var(--ink-2); font-weight: 500; text-align: left; }
  .rail-item:hover { background: var(--fill); }
  .rail-item[aria-current="page"] { background: var(--fill); color: var(--ink); font-weight: 600; }
  .rail-item[aria-current="page"] svg { color: var(--accent); }
  .rail-item .badge { margin-left: auto; }
  .rail-foot { margin-top: auto; display: grid; gap: 6px; border-top: 1px solid var(--rule); padding-top: 14px; }
  .rail-me { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 8px 10px; border-radius: 7px; text-align: left; }
  .rail-me:hover, .rail-me[aria-current="page"] { background: var(--fill); }
  .rail-me i { width: 30px; height: 30px; }
  .rail-me b { display: block; font-size: var(--t-sm); }
  .rail-me small { color: var(--ink-3); font-size: var(--t-xs); }
}

/* ---------- shared content ---------- */
.wrap { padding-inline: 16px; padding-block: 22px 40px; display: grid; gap: 30px; max-width: 1100px; margin-inline: auto; }
@container app (min-width: 900px) { .wrap { padding-inline: 44px; padding-block: 38px 64px; gap: 36px; } }
.scr-head { display: grid; gap: 6px; min-width: 0; }
.eyebrow { font: 600 .6875rem/1.3 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.scr-title { font: 760 var(--t-xl)/1.04 var(--f-display); font-stretch: 120%; letter-spacing: -.015em; }
@container app (min-width: 900px) { .scr-title { font-size: var(--t-2xl); } }
.lede { color: var(--ink-2); max-width: 62ch; }
.h2 { font: 680 var(--t-md)/1.2 var(--f-display); font-stretch: 112%; letter-spacing: -.005em; }
.sec { display: grid; gap: 14px; min-width: 0; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sub { color: var(--ink-2); font-size: var(--t-sm); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 7px; padding: 9px 14px; font-weight: 600; font-size: var(--t-sm); border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.link { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; font-size: var(--t-sm); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.chip-row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-block: 2px; min-width: 0; }
.chip-row::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 5px 12px; font-size: var(--t-sm); color: var(--ink-2); white-space: nowrap; }
.chip:hover { border-color: var(--ink-3); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chip-sep { flex: none; width: 1px; background: var(--rule); margin: 4px 4px; }
.strip { display: flex; height: 14px; border-radius: 2px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .06); }
.strip i { flex: 1; }
.strip:empty { background: repeating-linear-gradient(45deg, var(--fill) 0 6px, transparent 6px 12px); }
.sw { display: inline-block; width: 16px; height: 16px; border-radius: 2px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1); flex: none; vertical-align: -3px; }
.tag { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 4px; white-space: nowrap; }
.tag.s2 { background: var(--bad-bg); color: var(--bad); } .tag.s1 { background: var(--warn-bg); color: var(--warn); } .tag.s0 { background: var(--ok-bg); color: var(--ok); }
.tag.own { background: var(--accent-soft); color: var(--accent); }
.tag.miss { border: 1px dashed var(--ink-3); color: var(--ink-2); padding: 1px 6px; }
details > summary { list-style: none; cursor: pointer; }
details > summary::-webkit-details-marker { display: none; }
.chev { transition: transform .15s; color: var(--ink-3); }
details[open] > summary .chev { transform: rotate(180deg); }
.acc { border-top: 1px solid var(--rule); }
.acc:last-child { border-bottom: 1px solid var(--rule); }
.acc > summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 0; font-weight: 600; }
.acc .acc-body { padding: 0 0 16px; display: grid; gap: 10px; color: var(--ink-2); font-size: var(--t-sm); }
.acc dl { display: grid; gap: 10px; }
.acc dt { color: var(--ink); font-weight: 600; }
.acc .fine { color: var(--ink-3); font-size: var(--t-xs); }
.stagebox { background: var(--stage); border-radius: 6px; display: grid; place-items: center; overflow: hidden; }
.stagebox svg { display: block; width: 100%; height: auto; }

/* ---------- Hôm nay ---------- */
.today { grid-template-areas: "head" "id" "sug" "alerts" "short"; }
@container app (min-width: 900px) {
  .today { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); grid-template-areas: "head head" "sug id" "sug alerts" "sug short"; column-gap: 48px; align-items: start; }
  .today .sug { align-self: start; }
}
.ident { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 14px; align-items: center; }
.ident .stagebox { aspect-ratio: 4 / 5; }
.ident > div { display: grid; gap: 5px; min-width: 0; }
.ident .traits { margin-top: 0; }
.traits li.key { color: var(--ink); border-color: var(--ink-3); font-weight: 600; }
.pname { display: grid; gap: 4px; grid-column: 1 / -1; font-size: var(--t-xs); color: var(--ink-3); }
.pname input { font: 600 var(--t-md) var(--f-body); color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; min-height: 40px; width: 100%; max-width: 360px; }
.ident .pc { font: 700 var(--t-lg)/1.15 var(--f-display); }
.ident .pc small { font: 500 var(--t-sm) var(--f-body); color: var(--ink-2); }
.ident .tone { color: var(--ink-2); font-size: var(--t-sm); }
.traits { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.traits li { font-size: var(--t-xs); border: 1px solid var(--rule); border-radius: 4px; padding: 2px 7px; color: var(--ink-2); }
.sug { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; display: grid; grid-template-columns: 112px minmax(0, 1fr); grid-template-areas: "face head" "body body"; gap: 14px 16px; box-shadow: var(--lift); }
.sug .stagebox { grid-area: face; align-self: start; aspect-ratio: 4 / 5; }
.sug-head { grid-area: head; display: grid; gap: 4px; align-content: center; }
.sug-head h2 { font: 720 var(--t-lg)/1.12 var(--f-display); font-stretch: 112%; }
.sug-head .meta { color: var(--ink-3); font-size: var(--t-xs); }
.sug-body { grid-area: body; display: grid; gap: 12px; }
.sug-body p { color: var(--ink-2); font-size: var(--t-sm); }
.sug-body .strip { height: 18px; }
.owned-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
@container app (min-width: 900px) {
  .sug { grid-template-columns: 210px minmax(0, 1fr); grid-template-areas: "face head" "face body"; padding: 22px; gap: 10px 26px; }
  .sug-head { align-content: end; }
  .sug-body { align-content: start; }
}
.alert-list { display: grid; }
.alert-list li { display: grid; gap: 3px; padding: 12px 0; border-top: 1px solid var(--rule); }
.alert-list li:last-child { border-bottom: 1px solid var(--rule); }
.alert-list b { font-weight: 600; }
.alert-list p { color: var(--ink-2); font-size: var(--t-sm); }
.shortcuts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.sc { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: center; text-align: left; border: 1px solid var(--rule); background: transparent; border-radius: 8px; padding: 11px 12px; }
.sc:hover { border-color: var(--ink-3); }
.sc svg { grid-row: span 2; color: var(--accent); }
.sc b { font-size: var(--t-sm); font-weight: 600; }
.sc span { font-size: var(--t-xs); color: var(--ink-3); }

/* ---------- Bảng màu ---------- */
.rule-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; color: var(--ink-2); font-size: var(--t-sm); margin-top: 4px; }
.shift { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.shift .sw { width: 18px; height: 18px; }
.shift svg { width: 14px; height: 14px; color: var(--ink-3); }
.cat-tabs { display: flex; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--rule); margin-inline: -16px; padding-inline: 12px; }
.cat-tabs::-webkit-scrollbar { display: none; }
@container app (min-width: 900px) { .cat-tabs { margin-inline: 0; padding-inline: 0; } }
.cat-tab { flex: none; display: flex; align-items: center; gap: 7px; padding: 10px 10px 11px; border: 0; background: none; color: var(--ink-2); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.cat-tab .sw { width: 12px; height: 12px; border-radius: 50%; }
.cat-tab[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
.pal-grid { display: grid; gap: 30px; min-width: 0; }
@container app (min-width: 900px) { .pal-grid { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 48px; align-items: start; } }
.pal-main, .pal-side { display: grid; gap: 26px; min-width: 0; }
.pal-top { display: grid; gap: 12px; }
.pal-top .lead { font-size: var(--t-md); line-height: 1.45; max-width: 52ch; }
.hero-sw { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.hsw { display: grid; grid-template-rows: auto 1fr; padding: 0; border: 1px solid var(--rule); border-radius: 4px; background: var(--sheet); overflow: hidden; text-align: left; transition: transform .15s, box-shadow .15s, opacity .2s; }
.hsw:hover { transform: translateY(-2px); box-shadow: var(--lift); }
.hsw .chip-c { aspect-ratio: 4 / 5; }
.hsw .lab { padding: 8px 10px 10px; display: grid; gap: 2px; align-content: start; }
.hsw b { font-size: var(--t-sm); font-weight: 600; line-height: 1.3; }
.hsw code { font-size: 11px; color: var(--ink-3); }
@container app (min-width: 900px) { .hsw .chip-c { aspect-ratio: 1 / 1; } .hsw .lab { padding: 10px 12px 12px; } .hsw b { font-size: var(--t-base); } }
.good { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 14px; }
@container app (min-width: 900px) { .good { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.gsw { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center; padding: 6px 0; border: 0; background: none; text-align: left; transition: opacity .2s; border-radius: 4px; }
.gsw i { width: 34px; height: 34px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08); }
.gsw b { display: block; font-size: var(--t-sm); font-weight: 500; line-height: 1.25; }
.gsw code { font-size: 10.5px; color: var(--ink-3); }
.gsw:hover b { color: var(--accent); }
.dim { opacity: .25; }
.avoid > summary { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.avoid[open] > summary { border-bottom-color: transparent; }
.avoid .av-l { font-weight: 600; white-space: nowrap; }
.avoid .av-l span { color: var(--ink-3); font-weight: 400; }
.av-strip { display: flex; gap: 4px; overflow: hidden; }
.x { position: relative; width: 18px; height: 18px; border-radius: 2px; flex: none; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08); overflow: hidden; }
.x::after { content: ""; position: absolute; left: -3px; right: -3px; top: 50%; height: 1.5px; background: var(--paper); transform: rotate(-45deg); }
.av-list { display: grid; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
.av-list li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 2px 12px; padding: 9px 0; }
.av-list .x { width: 28px; height: 28px; grid-row: span 2; }
.av-list b { font-size: var(--t-sm); font-weight: 600; }
.av-list b code { font-weight: 400; color: var(--ink-3); margin-left: 6px; font-size: 10.5px; }
.av-list p { font-size: var(--t-sm); color: var(--ink-2); }
.owned-list { display: grid; gap: 10px; }
.owned-list li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; }
.owned-list .own-sw { width: 30px; height: 30px; border-radius: 3px; display: flex; overflow: hidden; grid-row: span 2; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08); }
.owned-list .own-sw i { flex: 1; }
.owned-list .own-sw.none { background: repeating-linear-gradient(135deg, var(--fill) 0 4px, transparent 4px 8px); box-shadow: inset 0 0 0 1px var(--rule); }
.owned-list b { font-size: var(--t-sm); font-weight: 600; line-height: 1.3; }
.owned-list small { color: var(--ink-3); font-size: var(--t-xs); grid-column: 2; }
.owned-list .link { grid-row: 1 / span 2; grid-column: 3; }

/* ---------- sheets ---------- */
.scrim { position: absolute; inset: 0; z-index: 30; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: absolute; z-index: 31; left: 0; right: 0; bottom: 0; max-height: 90%; display: flex; flex-direction: column; background: var(--sheet); border-radius: 16px 16px 0 0;
  box-shadow: 0 -10px 40px rgba(0, 0, 0, .18); transform: translateY(104%); visibility: hidden; transition: transform .26s cubic-bezier(.2, .8, .2, 1), visibility 0s .26s; }
.sheet.on { transform: none; visibility: visible; transition: transform .26s cubic-bezier(.2, .8, .2, 1); }
@container app (min-width: 900px) {
  .sheet { left: auto; top: 0; width: 440px; max-height: none; border-radius: 0; transform: translateX(104%); box-shadow: -10px 0 40px rgba(0, 0, 0, .16); }
}
.sh-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 8px; padding: 10px 12px 10px 18px; border-bottom: 1px solid var(--rule); position: relative; }

.field input { border: 1px solid var(--rule); background: var(--paper); border-radius: 7px; padding: 8px 10px; font: 500 var(--t-base) var(--f-mono); color: var(--ink); width: 100%; min-width: 0; }

.verdict { display: grid; gap: 8px; }
.pill { justify-self: start; display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; font-weight: 700; font-size: var(--t-sm); }

.alt-list { display: grid; }
.alt-list button { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 1px 12px; align-items: center; text-align: left; border: 0; border-top: 1px solid var(--rule); background: none; padding: 10px 0; }

.shop { display: grid; }

.shop li:last-child { border-bottom: 1px solid var(--rule); }

.lcard { display: grid; grid-template-rows: auto 1fr; padding: 0; border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet); overflow: hidden; text-align: left; transition: box-shadow .15s, transform .15s; }

/* ---------- Da ---------- */
.meds { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: var(--t-sm); margin-top: 4px; }

@container app (min-width: 900px) {
  .skin-grid { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); column-gap: 48px; align-items: start; }
  .skin-l, .skin-r { display: grid; gap: 28px; min-width: 0; align-content: start; }
}
.sum-row { display: flex; flex-wrap: wrap; gap: 6px 20px; align-items: baseline; }
.cnt { display: inline-flex; align-items: baseline; gap: 6px; font-size: var(--t-sm); color: var(--ink-2); }

/* ---------- Hồ sơ ---------- */

.notice { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 11px 12px; border-radius: 8px; background: var(--fill); font-size: var(--t-sm); color: var(--ink-2); }

.lc-ready { margin-top: 6px; }
.st-sw .stc { margin-left: 2px; }

.buy .b-val.soft { color: var(--ink-2); font-weight: 500; }

.pc-edit { padding: 6px 12px; min-height: 36px; }
.pc-pv { display: grid; gap: 8px; margin-top: 4px; }
.pc-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.pc-strip figure { display: grid; gap: 5px; min-width: 0; }
.pc-strip svg { display: block; width: 100%; aspect-ratio: 1; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08); }
.pc-strip figure.on svg { outline: 2px solid var(--accent); outline-offset: 2px; }

.seg3 { display: flex; border: 1px solid var(--rule); border-radius: 8px; padding: 2px; gap: 2px; }
.seg3 button { flex: 1; border: 0; background: none; padding: 7px 8px; border-radius: 6px; font-size: var(--t-sm); font-weight: 600; color: var(--ink-2); }
.seg3 button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.pk-ba { display: grid; grid-template-columns: minmax(0, 1fr) 18px minmax(0, 1fr); gap: 10px; align-items: center; }

.pk-panel { display: grid; gap: 14px; }

.pk-avg { display: flex; align-items: center; gap: 8px; margin-top: 3px; }

.pk-up:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.pk-presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 10px 8px; }
.pk-presets button { display: grid; gap: 4px; justify-items: center; border: 0; background: none; padding: 4px 2px; border-radius: 6px; font-size: 11px; color: var(--ink-2); line-height: 1.25; text-align: center; }

/* ---------- routine ticks, data controls ---------- */
.tstep:has(> .tick) { grid-template-columns: 22px minmax(0, 1fr) 24px; }

<div class="frame">
  <div class="app" id="app">
    <aside class="rail" aria-label="Navigation" data-i18n-aria="nav.nav">
      <button type="button" class="wordmark" data-go="today" id="rail-brand"></button>
      <button type="button" class="btn primary rail-check" data-open="checker" id="rail-check"></button>

const OM_PALETTE = {"id":"deep-autumn","name":["Thu đậm","Deep Autumn"],"native":"가을 딥","summary":["Thu đậm có tông ấm trung tính, trầm và sâu, độ tương phản từ trung bình đến cao. Màu hợp là màu đất, hồng nâu, gạch và nâu cacao; màu quá nhạt, lạnh hoặc rực dễ lệch.","Deep Autumn is warm-neutral, muted and deep, with medium to high contrast. It suits earthy tones, rose browns, brick and cocoa; colours that are too pale, cool or vivid tend to clash."],"cats":[{"id":"nen","name":["Kem nền / Cushion","Foundation / Cushion"],"short":["Nền","Base"],"lead":["Chọn nền gần tông da, sáng hơn tối đa khoảng 1 tông, undertone trung tính. Nền ngả vàng làm da ngả vàng.","Pick a base close to skin, at most about one shade lighter, with a neutral undertone. A yellow-leaning base turns skin yellow."],"good":[{"n":["Sáng hơn da nửa tông","Half a shade lighter than skin"],"rel":[2.0,-1.5,0],"occ":"dwhp","role":"","tier":"Best"},{"n":["Sáng hơn da 1 tông","One shade lighter than skin"],"rel":[4.0,-0.5,2],"occ":"dwh","role":"","tier":"Best"},{"n":["Sáng hơn da khoảng 1,5 tông","About 1.5 shades lighter than skin"],"rel":[6.0,-1.5,2],"occ":"dw","role":"","tier":"Good"},{"n":["Sáng hơn da hơn 1 tông","A bit over one shade lighter than skin"],"rel":[5.0,-1.0,1],"occ":"dwh","role":"","tier":"Good"},{"n":["Đúng tông da","Matches skin"],"rel":[-0.5,0.5,-1],"occ":"hp","role":"","tier":"Good"},{"n":["Đậm hơn da nửa tông, khi da rám","Half a shade deeper than skin, for tanned skin"],"rel":[-3.0,0.5,-2],"occ":"dp","role":"","tier":"Good"}],"avoid":[{"n":["Ngả vàng nhẹ","Yellow-leaning"],"rel":[-1.5,11.5,8],"why":["Nền ngả vàng làm da ngả vàng. Chỉ cân nhắc khi da rám.","A yellow-leaning base turns skin yellow. Consider it only on tanned skin."]},{"n":["Ngả vàng, đậm hơn da 1 tông","Yellow-leaning, a shade deeper than skin"],"rel":[-7.5,16.0,7],"why":["Nền ngả vàng làm da ngả vàng, lệch màu cổ.","A yellow-leaning base turns skin yellow and mismatches the neck."]},{"n":["Vàng nghệ","Turmeric yellow"],"rel":[0.0,20.5,15],"why":["Quá vàng, dễ ngả cam sau khi oxy hóa.","Too yellow, and tends to turn orange once it oxidises."]},{"n":["Be hồng lạnh","Cool pink beige"],"rel":[2.5,-3.0,-30],"why":["Hồng lạnh. Nếu da có nền đỏ thì cộng lại thành mặt ửng hồng xám.","Cool pink. On skin with a red base it adds up to a greyish pink flush."]},{"n":["Trắng sứ, sáng hơn da 2–3 tông","Porcelain white, 2–3 shades lighter than skin"],"rel":[9.5,-9.0,2],"why":["Sáng hơn da 2–3 tông, mặt bệch và lộ ranh giới ở cằm.","2–3 shades lighter than skin: the face looks pale and a line shows at the jaw."]},{"n":["Be xám ô liu","Grey olive beige"],"rel":[-13.0,-13.0,13],"why":["Thiếu sắc, làm da xỉn và mệt.","Lacks colour and makes skin look dull and tired."]}],"guide":{"title":["Chọn tông nền","Choosing a base shade"],"rows":[[["Undertone","Undertone"],["Chọn undertone trung tính, cùng hướng với da. Tránh nền ngả vàng: nó làm da ngả vàng. Hè da rám có thể chọn đậm hơn nửa tông.","Choose a neutral undertone that follows the skin. Avoid yellow-leaning bases: they turn skin yellow. In summer, tanned skin can go half a shade deeper."]],[["Da có nền đỏ","Red-based skin"],["Che đỏ quanh mũi và má bằng che khuyết điểm be trung tính, hoặc lót xanh lá mint nhạt (pastel, ánh trong, không phải xanh dương), chấm rất mỏng chỉ ở vùng đỏ, rồi phủ che khuyết điểm be trung tính lên. Không phủ nền vàng để át đỏ: mặt sẽ thành vàng xỉn.","Cover redness around the nose and cheeks with a neutral beige concealer, or first dot a pale mint-green corrector (pastel and sheer, not blue) very thinly on the red area only, then layer neutral beige concealer over it. Do not hide redness with a yellow base: the face turns dull yellow."]],[["Cushion","Cushion"],["Thường oxy hóa đậm lên nửa tông. Nếu phân vân giữa hai tông liền kề thì chọn tông sáng hơn cho cushion, tông đậm hơn cho kem nền lì.","It usually oxidises half a shade deeper. If you hesitate between two neighbouring shades, take the lighter for a cushion and the deeper for a matte foundation."]],[["Cách thử","How to test"],["Quẹt 3 vệt dọc quai hàm, chờ 10–15 phút, xem dưới ánh sáng cửa sổ. Vệt nào \"biến mất\" là đúng.","Swipe 3 stripes along the jaw, wait 10–15 minutes and check in window light. The stripe that disappears is the match."]],[["Da dầu","Oily skin"],["Nếu da đổ dầu: chỉ phủ phấn vùng chữ T, dặm bằng cách thấm dầu rồi vỗ lớp mỏng.","If skin gets oily: set only the T-zone with powder, and touch up by blotting the oil, then patting on a thin layer."]],[["Ký hiệu tham khảo","Reference labels"],["Ký hiệu undertone trên nhãn (trung tính, ấm, lạnh) mỗi hãng đặt một kiểu, chỉ là gợi ý. Nếu da có nền đỏ: so thêm với tông lạnh cùng độ đậm tại quầy.","The undertone labels on a pack (neutral, warm, cool) differ by brand and are only a hint. On skin with a red base, also compare a cool shade of the same depth in store."]]],"caveat":["Tên màu của hãng chỉ để tham khảo. Mỗi hãng đặt tên khác nhau và màu đổi theo lô, nên thử tại quầy hoặc dưới ánh sáng tự nhiên trước khi mua.","Brand shade names are a reference only. Each brand names shades differently and colours change between batches, so test in store or in natural light before buying."]},"finish":[["Hè: matte-satin, lâu trôi, kiềm dầu. Một lớp mỏng, dặm thêm chỗ cần che.","Summer: matte-satin, long-wear, oil-control. One thin layer, build up only where needed."],["Đông: satin hoặc glow nhẹ.","Winter: satin or a light glow."],["Phấn phủ: loại trong hoặc be ấm, không dùng phấn trắng (dễ flashback xám khi chụp đèn).","Setting powder: translucent or warm beige. Avoid white powder, which easily flashes back grey under a camera flash."]],"summer":["Nếu da dầu: primer kiềm dầu vùng chữ T. Cushion hoặc kem nền lâu trôi, phủ phấn mỏng, xịt khóa. Mang giấy thấm dầu thay vì dặm phấn chồng lớp.","If skin is oily: oil-control primer on the T-zone. Long-wear cushion or foundation, a thin layer of powder, then setting spray. Carry blotting paper instead of layering powder."],"winter":["Nếu da khô: có thể pha 1 giọt dầu dưỡng vào kem nền. Phấn phủ chỉ ở chữ T.","If skin is dry: mix 1 drop of facial oil into the foundation. Set only the T-zone with powder."]},{"id":"che","name":["Che khuyết điểm","Concealer"],"short":["Che khuyết","Conceal"],"lead":["Quầng mắt sáng hơn da khoảng 1 tông; chấm mụn và thâm đúng tông da hoặc tối hơn tối đa 1 tông (sáng hơn sẽ làm nốt mụn nổi lên); che đỏ bằng be trung tính.","Under-eye about one shade lighter than skin; spots and marks at skin tone or at most one shade deeper (lighter makes blemishes stand out); cover redness with neutral beige."],"good":[{"n":["Sáng hơn da 1 tông, quầng mắt","One shade lighter than skin, for under-eye"],"rel":[3.5,-1.0,1],"occ":"dwhp","role":"","tier":"Best"},{"n":["Đúng tông da, chấm mụn và thâm","Matches skin, for spots and marks"],"rel":[0.0,0.0,0],"occ":"dwhp","role":"","tier":"Best"},{"n":["Sáng hơn da nửa tông, quầng nhẹ","Half a shade lighter than skin, for light under-eye shadow"],"rel":[2.5,-1.0,1],"occ":"dwh","role":"","tier":"Good"},{"n":["Be đào rất nhẹ","Very light peach beige"],"rel":[2.0,4.5,-2],"occ":"dwp","role":"","tier":"Good"},{"n":["Đào, quầng nặng","Peach, for deep under-eye shadow"],"rel":[1.0,8.5,-3],"occ":"p","role":"","tier":"Good"},{"n":["Tối hơn da nửa–1 tông, chấm mụn và thâm","Half to one shade deeper than skin, for spots and marks"],"rel":[-3.5,3.5,0],"occ":"dwhp","role":"","tier":"Good"},{"n":["Be trung tính, che đỏ quanh mũi","Neutral beige, for redness around the nose"],"rel":[0.5,-0.5,1],"occ":"dw","role":"","tier":"Good"},{"n":["Xanh mint nhạt, color correct đỏ","Pale mint, to colour-correct redness"],"hex":"#d3e4c8","occ":"dwhp","role":["Color correct","Color correct"],"tier":"Good"}],"avoid":[{"n":["Trắng ngà rất sáng","Very light ivory white"],"rel":[10.0,-10.0,3],"why":["Sáng quá mức, phủ lên quầng thành vệt xám bạc.","Far too light: over under-eye shadow it turns into a silvery grey streak."]},{"n":["Be vàng","Yellow beige"],"rel":[2.0,14.5,12],"why":["Phủ lên vùng đỏ thành mảng vàng xỉn.","Over red areas it becomes a dull yellow patch."]},{"n":["Hồng lạnh","Cool pink"],"rel":[1.0,-1.0,-68],"why":["Làm quầng tím và vùng đỏ rõ hơn.","Makes purple under-eye shadow and red areas stand out more."]},{"n":["Xanh lá color correct dày","Thick green color corrector"],"hex":"#b9d3a8","why":["Dùng nhiều thành mảng xám; chỉ chấm rất mỏng lên vết đỏ.","Used heavily it turns into a grey patch. Dot it very thinly on red marks only."]}],"guide":{"title":["Chọn tông che","Choosing a concealer shade"],"rows":[[["Quầng mắt","Under-eye"],["Sáng hơn da khoảng 1 tông, tông trung tính hoặc đào nhạt. Quầng thâm nâu-tím thì lót đào mỏng trước.","About one shade lighter than skin, neutral or pale peach. For brown-purple shadow, prime with a thin layer of peach first."]],[["Mụn, vết thâm","Spots and marks"],["Đúng tông da hoặc tối hơn tối đa 1 tông; sáng hơn sẽ làm nốt mụn nổi lên.","At skin tone or at most one shade deeper. Lighter makes blemishes stand out."]],[["Vùng đỏ","Red areas"],["Nếu da có nền đỏ: be trung tính vỗ mỏng, hoặc lót xanh lá mint nhạt (pastel, ánh trong, không phải xanh dương), chấm rất mỏng chỉ ở chỗ đỏ, rồi phủ che khuyết điểm be trung tính lên. Không dùng be vàng để át đỏ.","On skin with a red base: pat on a thin layer of neutral beige, or first dot a pale mint-green corrector (pastel and sheer, not blue) very thinly on the red spot only, then layer neutral beige concealer over it. Do not use yellow beige to hide redness."]]],"caveat":["Tên màu của hãng chỉ để tham khảo, nên thử tại quầy hoặc dưới ánh sáng tự nhiên.","Brand shade names are a reference only, so test in store or in natural light."]},"finish":[["Vùng mắt: dạng lỏng mỏng, có độ ẩm, tránh loại khô lì dễ hằn nếp.","Eye area: a thin, hydrating liquid. Avoid dry matte formulas that crease."],["Vết mụn: dạng đặc, độ che cao. Chấm, vỗ mép, không tán rộng.","Blemishes: a thick, high-coverage formula. Dot it on, pat the edges, do not spread wide."]],"summer":["Dạng lỏng lâu trôi, lớp mỏng, set phấn ngay để không trôi vào nếp nhăn.","A long-wear liquid in a thin layer. Set with powder right away so it does not slide into lines."],"winter":["Dưỡng mắt trước 5 phút, dùng dạng kem mềm, set rất ít phấn.","Hydrate the eye area 5 minutes first, use a soft cream formula and set with very little powder."]},{"id":"ma","name":["Má hồng","Blush"],"short":["Má","Cheeks"],"lead":["Hồng be, hồng nâu muted, gạch hồng bụi, mauve nâu ấm. Màu trầm, ít rực.","Beige rose, muted rose brown, dusty rose brick, warm brown mauve. Subdued colours, not vivid."],"good":[{"n":["Hồng be","Beige rose"],"hex":"#c48b80","occ":"dwh","role":"","tier":"Best"},{"n":["Hồng nâu muted","Muted rose brown"],"hex":"#a8685f","occ":"dwh","role":"","tier":"Best"},{"n":["Gạch hồng bụi","Dusty rose brick"],"hex":"#b0645a","occ":"whp","role":"","tier":"Best"},{"n":["Mauve nâu ấm","Warm brown mauve"],"hex":"#9c666c","occ":"dw","role":"","tier":"Good"},{"n":["Gạch hồng","Rose brick"],"hex":"#a95548","occ":"hp","role":"","tier":"Good"},{"n":["Hồng đất đậm","Deep earthy rose"],"hex":"#94524c","occ":"hp","role":"","tier":"Good"},{"n":["Đỏ rượu nâu","Brown wine red"],"hex":"#7f3f3c","occ":"p","role":"","tier":"Good"}],"avoid":[{"n":["Mơ, đào","Apricot, peach"],"hex":"#e9997a","why":["Nếu da có nền đỏ, đào và cam lên hồng hoặc đỏ cam, khó đoán màu.","On skin with a red base, peach and orange turn pink or red-orange and are hard to predict."]},{"n":["Cam cháy","Burnt orange"],"hex":"#c8734f","why":["Nếu da có nền đỏ, đào và cam lên hồng hoặc đỏ cam.","On skin with a red base, peach and orange turn pink or red-orange."]},{"n":["Đào rất nhạt","Very pale peach"],"hex":"#f6c4ac","why":["Quá nhạt so với độ đậm Thu đậm, lên má gần như mất màu.","Too pale for Deep Autumn depth: it almost disappears on the cheeks."]},{"n":["Hồng baby pastel","Baby pink pastel"],"hex":"#f4b6c8","why":["Pastel lạnh, quá nhạt so với độ đậm Thu đậm.","A cool pastel, too pale for Deep Autumn depth."]},{"n":["Mauve lạnh","Cool mauve"],"hex":"#b48c9a","why":["Sắc xám tím làm mặt mệt.","A grey-purple cast makes the face look tired."]},{"n":["Fuchsia","Fuchsia"],"hex":"#d63c8c","why":["Quá lạnh và rực, bị nổi, lệch hẳn màu da.","Too cool and vivid: it stands out and clashes with the skin."]}],"finish":[["Dạng kem hoặc tint cho hiệu ứng ửng tự nhiên. Nếu da có nền đỏ: đánh ít hơn dự định, màu lên da đậm hơn trong tay.","Cream or tint for a natural flush. On skin with a red base, apply less than planned: the colour looks deeper on skin than on the hand."],["Dạng phấn khi da dầu. Đánh mỏng rồi tăng dần, tán đều viền để không thành mảng.","Powder for oily skin. Apply lightly and build up, blending the edges so there is no visible patch."]],"summer":["Tint hoặc phấn lâu trôi, hồng be và gạch hồng bụi. Đánh sau phấn phủ để không loang.","Long-wear tint or powder in beige rose and dusty rose brick. Apply after setting powder so it does not blotch."],"winter":["Má kem đánh trước phấn phủ. Hồng đất đậm, đỏ rượu nâu cho tiệc.","Cream blush before setting powder. Deep earthy rose and brown wine red for parties."]},{"id":"son","name":["Son","Lipstick"],"short":["Son","Lips"],"lead":["Hồng nâu, MLBB hồng, gạch hồng, đỏ gạch nâu, burgundy, mahogany, cacao hồng. Nếu da có nền đỏ, cam và rust dễ lên đỏ cam.","Rose brown, rosy MLBB, rose brick, brown brick red, burgundy, mahogany, rosy cocoa. On skin with a red base, orange and rust easily turn red-orange."],"good":[{"n":["MLBB hồng đất","MLBB earthy rose"],"hex":"#b0706a","occ":"dwh","role":"","tier":"Best"},{"n":["Hồng nâu","Rose brown"],"hex":"#a0645e","occ":"dwh","role":"","tier":"Best"},{"n":["Gạch hồng","Rose brick"],"hex":"#a84a44","occ":"dwhp","role":"","tier":"Best"},{"n":["Cacao hồng đậm","Deep rosy cocoa"],"hex":"#7e4b42","occ":"wh","role":"","tier":"Good"},{"n":["Đỏ gạch nâu","Brown brick red"],"hex":"#93382a","occ":"hp","role":"","tier":"Good"},{"n":["Mahogany","Mahogany"],"hex":"#7a3a32","occ":"hp","role":"","tier":"Good"},{"n":["Đỏ rượu ấm","Warm wine red"],"hex":"#7a2a2c","occ":"p","role":"","tier":"Good"},{"n":["Burgundy nâu","Brown burgundy"],"hex":"#6a2f2b","occ":"p","role":"","tier":"Good"}],"avoid":[{"n":["Cam tươi","Bright orange"],"hex":"#e8732c","why":["Nếu da có nền đỏ, cam tươi lên đỏ cam gắt, làm răng ngả vàng.","On skin with a red base, bright orange turns harsh red-orange and makes teeth look yellow."]},{"n":["Đào nhạt","Pale peach"],"hex":"#f0a898","why":["Quá nhạt so với độ đậm Thu đậm, môi chìm và mặt nhợt.","Too pale for Deep Autumn depth: lips fade into the face and the face looks washed out."]},{"n":["San hô pastel","Pastel coral"],"hex":"#f4a58a","why":["Quá nhạt, và nếu da có nền đỏ thì đào lên hồng nhạt.","Too pale, and on skin with a red base peach turns pale pink."]},{"n":["Nude be nhạt","Pale beige nude"],"hex":"#e6c3ae","why":["Quá nhạt, gần màu da.","Too pale, close to the skin colour."]},{"n":["Fuchsia lạnh","Cool fuchsia"],"hex":"#c2185b","why":["Lạnh và gắt, làm da trông vàng xỉn.","Cool and harsh, it makes skin look dull yellow."]},{"n":["Hồng bạc frost","Frosted silver pink"],"hex":"#e8b4c8","why":["Nhũ bạc lạnh, lộ vân môi.","Cool silver shimmer that shows lip lines."]},{"n":["Tím mận lạnh","Cool plum purple"],"hex":"#6e2a52","why":["Ngả tím lạnh, làm răng và da ngả vàng.","A cool purple cast that makes teeth and skin look yellow."]}],"finish":[["Satin hoặc matte mềm. Lì khô hoàn toàn dễ lộ vân môi vào mùa hanh.","Satin or soft matte. Fully dry matte shows lip lines in the dry season."],["Tint và velvet hợp đi làm vì lâu trôi, dặm ít.","Tint and velvet suit work: long-wearing, little touch-up."]],"summer":["Tint hoặc matte nhẹ lâu trôi. MLBB hồng đất, gạch hồng cho ngày nóng. Cam đất và rust dễ lên đỏ cam nếu da có nền đỏ, nên thử trước khi mua.","Long-wear tint or light matte. Earthy rose MLBB and rose brick for hot days. Earthy orange and rust easily turn red-orange on skin with a red base, so test before buying."],"winter":["Ủ môi buổi tối, sáng dùng son dưỡng có màu hoặc satin. Đỏ gạch nâu, mahogany, burgundy nâu.","Prep lips in the evening, and use a tinted balm or satin in the morning. Brown brick red, mahogany, brown burgundy."]},{"id":"mat","name":["Phấn mắt","Eyeshadow"],"short":["Mắt","Eyes"],"lead":["Nền be hồng, màu chính hồng nâu, cacao, gạch hồng; chiều sâu chỉ ở sát chân mi.","A rosy beige base, main colours in rose brown, cocoa and rose brick; depth only at the lash line."],"good":[{"n":["Hồng nâu","Rose brown"],"hex":"#b07a6e","occ":"dwh","role":["Màu chính","Main colour"],"tier":"Best"},{"n":["Socola","Chocolate"],"hex":"#5a3a2c","occ":"dwhp","role":["Màu đậm","Depth"],"tier":"Best"},{"n":["Rose gold","Rose gold"],"hex":"#c7887e","occ":"dhp","role":["Nhũ","Shimmer"],"tier":"Best"},{"n":["Be hồng trung tính","Neutral rosy beige"],"hex":"#e6c6b4","occ":"dwhp","role":["Màu nền mắt","Lid base"],"tier":"Good"},{"n":["Be cacao nhạt","Light cocoa beige"],"hex":"#d9b8a6","occ":"dwh","role":["Màu nền mắt","Lid base"],"tier":"Good"},{"n":["Cacao","Cocoa"],"hex":"#926454","occ":"dwh","role":["Màu chính","Main colour"],"tier":"Good"},{"n":["Gạch hồng muted","Muted rose brick"],"hex":"#a8665c","occ":"whp","role":["Màu chính","Main colour"],"tier":"Good"},{"n":["Taupe nâu ấm nhẹ","Soft warm taupe"],"hex":"#9a7a6c","occ":"dw","role":["Màu chính","Main colour"],"tier":"Good"},{"n":["Nâu mahogany","Mahogany"],"hex":"#6b3a34","occ":"hp","role":["Màu đậm","Depth"],"tier":"Good"},{"n":["Bronze dịu","Soft bronze"],"hex":"#a67c5f","occ":"hp","role":["Nhũ","Shimmer"],"tier":"Good"}],"avoid":[{"n":["Maple, cam cháy","Maple, burnt orange"],"hex":"#c0703f","why":["Nếu da có nền đỏ, maple và cam cháy lên cam đỏ, mí trông sưng.","On skin with a red base, maple and burnt orange turn orange-red and the lid looks swollen."]},{"n":["Vàng gold nhũ","Shimmery yellow gold"],"hex":"#c99a62","why":["Ánh vàng làm mí ngả vàng; chọn rose gold hoặc bronze dịu.","The gold cast turns the lid yellow. Choose rose gold or soft bronze."]},{"n":["Nâu đen phủ cả mí","Black-brown over the whole lid"],"hex":"#2e211c","why":["Phủ cả mí làm mắt trông nhỏ, sưng. Chỉ dùng làm kẻ mắt.","Over the whole lid it makes eyes look small and puffy. Use it only as liner."]},{"n":["Hồng pastel","Pastel pink"],"hex":"#f0c4d6","why":["Hồng nhạt trên mí làm mắt trông sưng.","Pale pink on the lid makes eyes look puffy."]},{"n":["Đỏ hồng nhạt phủ mí","Pale red-pink over the lid"],"hex":"#e8a0a0","why":["Đỏ nhạt trên cả mí làm mắt như vừa khóc, sưng.","Pale red over the whole lid looks like crying and puffy."]},{"n":["Nude quá nhạt làm màu chính","Too-pale nude as main colour"],"hex":"#eee2d8","why":["Chỉ hợp làm màu nền mắt. Dùng làm màu chính thì mắt phẳng, mất chiều sâu.","Works only as a lid base. As the main colour it flattens the eye and loses depth."]},{"n":["Bạc","Silver"],"hex":"#dcdde2","why":["Ánh bạc lạnh, lộ nhũ và nếp da.","Cool silver that shows glitter and skin creases."]},{"n":["Nhũ băng (icy)","Icy shimmer"],"hex":"#e4eef2","why":["Ánh xanh lạnh, bị nổi, lệch hẳn màu da.","A cool blue cast that stands out and clashes with the skin."]},{"n":["Xám lạnh","Cool grey"],"hex":"#8c8e94","why":["Không có sắc ấm, làm bầu mắt trông thâm, mệt.","No warmth: it makes the eye area look dark and tired."]},{"n":["Nhũ hạt to (glitter)","Chunky glitter"],"hex":"#e9d6e6","why":["Nếu mí dầu, hạt nhũ to trôi vào nếp mí và rơi xuống bọng mắt.","On oily lids, big glitter particles slide into the lid crease and fall under the eyes."]}],"guide":{"title":["Chọn bảng mắt","Choosing a palette"],"rows":[[["Cách chọn","How to choose"],["Một bảng tốt có đủ 4 vai: nền be hồng trung tính, 2–3 màu chính hồng nâu hoặc cacao, 1 nâu đậm sát chân mi, 1 nhũ rose gold hạt mịn.","A good palette covers 4 roles: a neutral rosy beige base, 2–3 main colours in rose brown or cocoa, 1 deep brown for the lash line and 1 fine-grain rose gold shimmer."]]],"caveat":["Mỗi bảng có nhiều phiên bản màu, nên swatch thử tại quầy hoặc dưới ánh sáng tự nhiên.","Each palette comes in several colourways, so swatch it in store or in natural light."]},"extraTitle":["Kỹ thuật tô mắt","Eyeshadow technique"],"extra":["Nền be hồng phủ cả mí lên đến dưới xương chân mày. Màu chính đánh từ chân mi lên đến nếp mí, tán mờ viền trên. Màu đậm (socola, nâu gạch) chỉ ở 1/3 đuôi mắt và sát chân mi, kéo nhẹ ra ngoài theo hướng đuôi mày. Nhũ chấm giữa mí, từ con ngươi vào trong. Viền mắt dưới: màu chính tán mỏng 1/3 ngoài, không đánh cả viền dưới. Nếu mí dầu: lót kem lót mắt, đánh lớp nền lì trước, rồi mới đến màu và nhũ.","Sweep the rosy beige base over the whole lid up to below the brow bone. Apply the main colour from the lash line up to the crease and blur the upper edge. Keep the depth colour (chocolate, brick brown) to the outer third and the lash line, drawn slightly outwards along the brow tail. Dab shimmer on the centre of the lid, from the pupil inwards. Lower lash line: blend the main colour thinly on the outer third only, not along the whole line. On oily lids: use eye primer, lay a matte base first, then colour and shimmer."],"finish":[["Nền và màu chính dùng lì hoặc satin; nhũ hạt mịn chỉ ở giữa mí.","Matte or satin for the base and main colour; fine shimmer on the centre of the lid only."],["Nếu mí dầu: kem lót mắt, phấn lì làm nền, tránh nhũ hạt to và phấn mắt dạng kem không lâu trôi.","If lids are oily: eye primer and a matte powder base. Avoid chunky glitter and cream shadows that do not last."]],"summer":["Kem lót mắt chống trôi, nền be hồng lì, màu chính hồng nâu hoặc taupe. Kẻ mắt nâu socola chống nước.","Long-wear eye primer, a matte rosy beige base, rose brown or taupe as the main colour. Waterproof chocolate-brown liner."],"winter":["Dạng satin. Gạch hồng muted, nâu mahogany, nhũ rose gold cho các buổi tiệc cuối năm.","Satin finish. Muted rose brick, mahogany and rose gold shimmer for end-of-year parties."]},{"id":"khoi","name":["Tạo khối","Contour"],"short":["Khối","Contour"],"lead":["Nâu taupe trung tính, đậm hơn da 2–3 tông.","Neutral taupe brown, 2–3 shades deeper than skin."],"good":[{"n":["Taupe nâu trung tính","Neutral taupe brown"],"hex":"#957a68","occ":"dwhp","role":"","tier":"Best"},{"n":["Nâu hồng trung tính","Neutral rosy brown"],"hex":"#9a7568","occ":"dh","role":"","tier":"Best"},{"n":["Nâu sữa","Milky brown"],"hex":"#a8826a","occ":"dw","role":"","tier":"Good"},{"n":["Nâu cacao nhạt","Light cocoa brown"],"hex":"#94705a","occ":"whp","role":"","tier":"Good"},{"n":["Nâu mát-ấm","Balanced cool-warm brown"],"hex":"#8a6c5c","occ":"hp","role":"","tier":"Good"},{"n":["Taupe đậm, buổi tối","Deep taupe, evening"],"hex":"#7e5e4b","occ":"p","role":"","tier":"Good"}],"avoid":[{"n":["Cam bronze","Orange bronze"],"hex":"#c27a45","why":["Ra vệt cam như cháy nắng, không giống bóng đổ.","Leaves an orange streak like a sunburn, not a natural shadow."]},{"n":["Xám taupe","Grey taupe"],"hex":"#8f8580","why":["Quá xám so với da ấm, nhìn như vết bẩn.","Too grey against warm skin: it looks like a smudge of dirt."]},{"n":["Nâu đỏ","Red brown"],"hex":"#8b4a3a","why":["Ngả đỏ, thành mảng ửng thay vì bóng đổ.","Leans red and becomes a flushed patch instead of a shadow."]}],"finish":[["Lì, không nhũ. Đặt dưới gò má, dọc chân tóc và dưới đầu cằm; tán bằng cọ xiên, đánh mỏng rồi tăng dần.","Matte, no shimmer. Place it under the cheekbone, along the hairline and under the chin; blend with an angled brush, starting thin and building up."],["Dạng kem/stick cho da khô, dạng phấn cho da dầu.","Cream or stick for dry skin, powder for oily skin."]],"summer":["Dạng phấn, taupe trung tính. Tránh bronzer cam: nếu da có nền đỏ, cam thành mảng đỏ cam.","Powder in a neutral taupe. Avoid orange bronzer: on skin with a red base it turns into a red-orange patch."],"winter":["Taupe trung tính dạng kem hoặc stick, tán khi nền còn ẩm.","Neutral taupe in cream or stick form, blended while the base is still damp."]},{"id":"hl","name":["Highlight","Highlight"],"short":["Highlight","Highlight"],"lead":["Sáng hơn da rõ ràng, sắc trung tính đến hơi hồng. Không vàng gold.","Clearly lighter than skin, neutral to slightly pink. No yellow gold."],"good":[{"n":["Be hồng nhạt","Pale rosy beige"],"hex":"#ffe5da","occ":"dwh","role":["Lì","Matte"],"tier":"Best"},{"n":["Champagne be hồng","Rosy champagne"],"hex":"#ffe9dc","occ":"dhp","role":["Căng bóng","Glow"],"tier":"Best"},{"n":["Pearl be hồng","Rosy pearl"],"hex":"#fde9e3","occ":"hp","role":["Nhũ","Shimmer"],"tier":"Best"},{"n":["Ivory be trung tính","Neutral ivory"],"hex":"#f9e7d5","occ":"dw","role":["Lì","Matte"],"tier":"Good"},{"n":["Be sữa","Milky beige"],"hex":"#f7e5d4","occ":"dw","role":["Lì","Matte"],"tier":"Good"},{"n":["Pearl be","Pearl beige"],"hex":"#fdebdd","occ":"dwh","role":["Căng bóng","Glow"],"tier":"Good"},{"n":["Peach-pearl trung tính","Neutral peach pearl"],"hex":"#ffe8db","occ":"hp","role":["Căng bóng","Glow"],"tier":"Good"},{"n":["Be hồng ánh rose gold","Rose-gold pink beige"],"hex":"#ffe8dd","occ":"hp","role":["Nhũ","Shimmer"],"tier":"Good"},{"n":["Champagne hồng","Pink champagne"],"hex":"#feeadf","occ":"hp","role":["Nhũ","Shimmer"],"tier":"Good"},{"n":["Soft gold","Soft gold"],"hex":"#feecd9","occ":"p","role":["Nhũ","Shimmer"],"tier":"Good"}],"avoid":[{"n":["Champagne vàng","Yellow champagne"],"hex":"#fdedcc","why":["Nếu da có nền đỏ, ánh vàng làm da ngả vàng xỉn.","On skin with a red base, the yellow cast turns skin dull yellow."]},{"n":["Vàng gold","Yellow gold"],"hex":"#e2b866","why":["Vàng đậm, lại không sáng hơn da: thành mảng vàng.","Deep yellow that is not lighter than skin: it becomes a yellow patch."]},{"n":["Vàng đồng","Bronze gold"],"hex":"#d4a35c","why":["Tối hơn da và vàng: không bắt sáng, chỉ làm mặt ngả vàng.","Deeper than skin and yellow: it does not catch light, it only turns the face yellow."]},{"n":["Trắng nhũ frost","Frosted white shimmer"],"hex":"#f6f4f2","why":["Thành vệt trắng xám, nhất là khi chụp flash.","Turns into a greyish white streak, especially under flash."]},{"n":["Bạc","Silver"],"hex":"#d9dce2","why":["Ánh kim lạnh, nhìn như lớp sơn.","A cool metallic that looks like a coat of paint."]},{"n":["Hồng tím lạnh","Cool purple pink"],"hex":"#e8cfe6","why":["Sắc tím lạnh, bị nổi, lệch hẳn màu da.","A cool purple cast that stands out and clashes with the skin."]}],"extraTitle":["Ba kiểu highlight","Three highlight finishes"],"extra":["Lì: sáng hơn da 1–2 tông, không nhũ, để làm sáng vùng thái dương lõm, dưới mắt, sống mũi, xương chân mày. Khác che khuyết điểm: che khuyết điểm để che, highlight lì sáng hơn một tông để làm sáng. Căng bóng (glow/satin): dạng kem hoặc lỏng, ngọc trai mịn không thấy hạt, cho vẻ da ướt. Nhũ: thấy rõ hạt lấp lánh, chỉ ở khóe mắt trong.","Matte: 1–2 shades lighter than skin, no shimmer, to brighten hollow temples, under the eyes, the nose bridge and the brow bone. It differs from concealer: concealer is for covering, a matte highlight one shade lighter is for brightening. Glow (glow/satin): a cream or liquid with fine pearl and no visible particles, for a wet-skin look. Shimmer: visible sparkling particles, only at the inner corner of the eye."],"finish":[["Lì: dùng được ở vùng chữ T, thay phấn phủ làm sáng.","Matte: works on the T-zone, replacing a brightening powder."],["Căng bóng: chỉ ở chỗ cần nhấn (đầu mắt, cung môi), tránh vùng chữ T nếu da dễ bóng dầu.","Glow: only where emphasis is needed (inner eye, cupid's bow). Avoid the T-zone if skin gets shiny."],["Nhũ: phủ lớp nền trước rồi mới đánh nhũ; hạt nhũ chỉ đặt đúng chỗ cần nhấn.","Shimmer: lay a base first, then apply shimmer, placing the particles only where emphasis is needed."]],"summer":["Lì là chính ở thái dương, dưới mắt, thêm chút nhũ ở khóe mắt trong cho tối.","Matte is the main choice on the temples and under the eyes, with a little shimmer at the inner corner for evenings."],"winter":["Kem căng bóng ở đầu mắt, cung môi; thái dương dùng lì. Đánh trước phấn phủ.","Glow cream at the inner eye and cupid's bow, matte on the temples. Apply before setting powder."]},{"id":"may","name":["Chân mày","Brows"],"short":["Mày","Brows"],"lead":["Nâu trung tính đậm đến nâu xám mềm, sáng hơn tóc nửa tông.","Deep neutral browns to soft grey-browns, a touch lighter than the hair."],"good":[{"n":["Xám nâu đậm","Deep grey-brown"],"hex":"#4a4340","occ":"dwhp","role":"","tier":"Best"},{"n":["Nâu tro đậm","Deep ash brown"],"hex":"#3d3532","occ":"dwhp","role":"","tier":"Best"},{"n":["Xám đen mềm","Soft grey-black"],"hex":"#342d2b","occ":"hp","role":"","tier":"Good"},{"n":["Nâu xám trung tính","Neutral grey-brown"],"hex":"#5a504a","occ":"dw","role":"","tier":"Good"},{"n":["Nâu xám ấm","Warm grey-brown"],"hex":"#52463d","occ":"dwh","role":"","tier":"Good"},{"n":["Taupe xám","Grey taupe"],"hex":"#655a52","occ":"dh","role":"","tier":"Good"},{"n":["Nâu xám nhạt (layout nhẹ)","Light grey-brown (light look)"],"hex":"#716660","occ":"dh","role":"","tier":"Good"}],"avoid":[{"n":["Đen tuyền","Jet black"],"hex":"#151313","why":["Cứng, làm mặt già và khắc khổ.","Harsh: it ages the face and looks severe."]},{"n":["Xám tro lạnh","Cool ash grey"],"hex":"#6e6c6d","why":["Xám thuần, không có ánh nâu: chân mày nhìn nhạt và cũ.","Pure grey with no brown: brows look faded and dated."]},{"n":["Xám tro nhạt","Pale ash grey"],"hex":"#8a8686","why":["Quá nhạt và lạnh, mày mất nét.","Too pale and cool: the brows lose definition."]},{"n":["Nâu đỏ cam","Orange-red brown"],"hex":"#8a4a2a","why":["Ngả cam đỏ, dễ lệch màu so với tóc.","Leans orange-red and easily clashes with the hair colour."]}],"finish":[["Chì mảnh vẽ sợi, phấn mày tán nền, gel trong cố định.","A fine pencil for hair strokes, brow powder to fill, clear gel to set."],["Đầu mày nhạt, đuôi mày đậm.","Light at the head of the brow, deeper at the tail."]],"summer":["Gel mày chống nước hoặc chì lâu trôi.","Waterproof brow gel or a long-wear pencil."],"winter":["Chì hoặc sáp, chải gel trong. Có thể đậm hơn nửa tông nếu tóc rất tối.","Pencil or wax, brushed with clear gel. Can go half a shade deeper if the h       else if (l < 20) bad(1, "j.mat.tooDark");
      else if (inHue(hr, 325, 12) && l > 65 && s > 35) bad(1, "j.mat.pinkPuffy");
      else if (l > 85) bad(1, "j.mat.tooLight");
      else if (s > 70) bad(1, "j.mat.vivid");
      else if (inHue(hr, 14, 45) && s > 40 && l >= 35 && l <= 70) bad(1, "j.mat.orange");
      else if (inHue(hr, 45, 75)) good.push("j.mat.olive");
      else if (!inHue(hr, 338, 45)) bad(1, "j.mat.cool");
      else if (l < 35) good.push("j.mat.deepOk");
      else if (l > 70) good.push("j.mat.lightOk");
      else if (s < 15) bad(1, "j.mat.greyish");
      else good.push("j.mat.mainOk");

      else if (s > 50) bad(2, "j.khoi.orange");
      else if (s > 40) bad(1, "j.khoi.warm");

      if (dL > -10) bad(2, "j.khoi.notDeep");
      else if (dL < -45) bad(1, "j.khoi.veryDeep");

      break;

      if (dL <= 0) bad(2, "j.hl.same");
      else if (dL < 5) bad(1, "j.hl.weak");
      if ((s < 10 && l > 85) || (l > 92 && s < 35)) bad(2, "j.hl.frost");
      else if (!inHue(hr, 330, 45)) bad(2, "j.hl.cool");
      else if (hr > 28 && hr < 45 || (s > 60 && inHue(hr, 20, 45))) bad(1, "j.hl.gold");
      else if (s < 15) bad(1, "j.hl.greyish");
      else if (dL > 0) good.push(dL >= 8 ? "j.hl.good8" : "j.hl.good");
      break;
    case "may":
      if (l > 50) bad(2, "j.may.tooLight");
      if (l < 10) bad(2, "j.may.black");
      else if (s < 8) bad(1, "j.may.ash");
      else if (s > 45) bad(2, "j.may.redOrange");
      else if (inHue(h, 10, 45)) good.push("j.may.good");
      else bad(1, "j.may.odd");

  let v = 0;
  issues.forEach(i => { if (i[0] > v) v = i[0]; });
  let notes = issues.filter(i => i[0] > 0).sort((a, b) => b[0] - a[0]).map(i => i[1]);
  issues.forEach(i => { if (i[0] === 0) good.push(i[1]); });
  if (!notes.length) notes = good;
  return { v, notes: notes.slice(0, 3), hsl: c, dL, hr: SHIFTED[cat] ? hr : null };
}

  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(KEY + k); } catch (e) { /* nothing to remove */ } }
};
const isObj = v => v && typeof v === "object" && !Array.isArray(v);
// Objects merge key by key; arrays and scalars in `over` replace the base value.
function deepMerge(base, over) {
  if (!isObj(base) || !isObj(over)) return over === undefined ? base : over;
  const out = Object.assign({}, base);
  Object.keys(over).forEach(k => { out[k] = k in base ? deepMerge(base[k], over[k]) : over[k]; });
  return out;
}

const COLOR_KEYS = ["skin", "found", "lip", "brow", "hair", "iris"];
// Neutral stand-ins for a profile that leaves a colour out.
const COLOR_FALLBACK = { skin: "#dfb593", lip: "#c98f84", brow: "#4a3c34", hair: "#2a2220", iris: "#4a3a30" };

function normaliseProfile(raw) {
  const p = deepMerge({
    schema: 1, name: "", season: "deep-autumn", shade: "", colors: {}, undertone: { shift: 0 },
    location: { id: "other", climate: "mild" }, identity: {}, face: {}, inventory: {}, routine: {},
    looks: [], catalogFit: {}, picks: [], checker: {}, i18n: {}, dataEn: {}, nameEn: {}
  }, raw || {});
  p.inventory = deepMerge({ rows: [], names: {}, care: [] }, p.inventory);
  p.routine = deepMerge({ am: [], noon: [], pm: [], meds: [] }, p.routine);
  p.checker = deepMerge({ samples: { son: [], may: [] }, liner: null }, p.checker);
  p.face = deepMerge({ analysis: null, rules: {}, hints: {}, weight: null, notes: {}, geometry: {} }, p.face);
  COLOR_KEYS.forEach(k => {
    const c = isObj(p.colors[k]) ? p.colors[k] : {};
    const hex = normHex(c.hex) || COLOR_FALLBACK[k] || null;
    if (!hex) { delete p.colors[k]; return; }
    p.colors[k] = Object.assign({}, c, { hex, nm: isObj(c.nm) ? c.nm : {} });
    ["rim", "head", "dark"].forEach(part => { if (part in p.colors[k]) p.colors[k][part] = normHex(p.colors[k][part]) || undefined; });
  });
  p.undertone.shift = Number(p.undertone.shift) || 0;
  return p;
}

// How well the entry's own colours suit this skin: share of judged colours that pass, half credit for "okay".
function computeFit(e) {
  if (e.kind === "traditional") return { level: "Tham khảo", ok: 0, n: 0 };
  let score = 0, n = 0;
  e.originalPalette.forEach(p => {
    const cat = ROLE_CAT[p.role], hex = normHex(p.hex);
    if (!cat || !hex) return;
    const v = judge(hex, cat, SKIN()).v;
    score += v === 0 ? 1 : v === 1 ? .5 : 0; n++;
  });
  if (!n) return { level: "Tham khảo", ok: 0, n: 0 };
  const r = score / n;
  return { level: r >= .7 ? "Hợp sẵn" : r >= .4 ? "Đổi màu là hợp" : "Khó hợp", ok: Math.round(score), n };
}

/* ---------- shared bits ---------- */
const lkName = id => { const l = GL[id]; if (LANG === "en" && NAME_EN[id]) return NAME_EN[id]; const m = titleParts(l.name)[0].replace(/\s+makeup$/i, ""); return m.split(" / ")[0]; };
const names = (ids, max) => { const n = ids.map(lkName); return n.length > (max || 4) ? n.slice(0, max || 4).join(", ") + " " + t("more", { n: n.length - (max || 4) }) : n.join(", "); };
const ST_LABEL = { ok: "st.ok", near: "st.near", miss: "st.miss", unk: "st.unk" };
const stChip = s => `<span class="stc ${s}">${t(ST_LABEL[s])}</span>`;
function readyBadge(g) {

const itemName = it => it.buy ? pickName(it.buy) : it.multi && SHOPST.split.length ? t("inv.tintsOther") : it.nameK ? t(it.nameK) : it.nameP ? tx(it.nameP) : it.name;
const itemShort = it => it.buy ? pickName(it.buy) : it.shortK ? t(it.shortK) : it.shortP !== undefined ? tx(it.shortP) : it.short;
const panName = p => p.k ? t(p.k, { n: p.n }) : p.label || dx("swatch", p.swatch);
const srcName = s => s.item.pans ? `${itemShort(s.item)} · ${panName(s.item.pans[s.pan])}` : itemShort(s.item);
const catName = c => t("cat." + c);
const pickName = p => p.pans ? t("grp." + p.group) : `${catName(p.cat)} · ${dx("swatch", p.swatch)}`;
const ROLE_WORD = { base: "r.base", main: "r.main", depth: "r.depth", liner: "r.liner", shimmer: "r.shimmer", matte: "r.matte", glow: "r.glow", cream: "r.cream", powder: "r.powder" };
// Plain name of a required colour: "be hồng trung tính – màu nền mắt".

const pickHexes = p => p.pans ? p.pans.map(x => x.hex) : [p.hex];

/* ---------- similarity in words: the UI never shows ΔE ---------- */
function diffWords(own, need, ownName, needName, cat) {

  return t("why.diff", { own: ownName, d: d.map(x => t("d." + x[0])).join(t("d.and")), need: nn, cons: t(ck, { need: nn }) });
}
function nearWords(own, need, cat) { const d = diffs(own, need)[0]; return d ? t(STR["n." + cat + "." + d[0]] ? "n." + cat + "." + d[0] : "why.near", { d: t("d." + d[0]) }) : ""; }
const pair = (need, own) => `<span class="pair2" title="${esc(t("pair.tip"))}"><i${need ? ` style="background:${need}"` : ' class="none"'}></i><i class="${own ? "" : "none"}"${own ? ` style="background:${own}"` : ""}></i></span>`;

  ${open.length ? `<ul class="mine-list">${open.map(li).join("")}</ul>` : ""}

</section>`;

/* Face geometry. The drawing in 60-face.js reads everything about the face from one object, G. A profile can give any part of it
   (face.geometry.outline, .eyes, .lips, ...) or just a few parameters (face.geometry.params) and let the generators below draw
   a neutral, symmetric face. Coordinates live in a 240x300 box: x centred on 120, hairline at the top, chin near y 250. */
const FACE_SHAPES = {
  // Half-width of the outline at each y in SHAPE_Y, from the hairline to the chin.
  oval:   [14, 31, 47, 56, 62, 65, 66, 66, 65, 62, 58, 52, 44, 34, 20],
  round:  [18, 36, 52, 62, 68, 71, 72, 72, 71, 68, 62, 55, 46, 36, 22],
  heart:  [16, 36, 54, 64, 70, 71, 69, 65, 59, 52, 45, 38, 30, 22, 12],
  square: [16, 34, 50, 60, 66, 68, 68, 68, 68, 67, 64, 59, 51, 40, 26],

function slotOf(label) {

  if (/^Nhũ/i.test(L)) return "shimmer";
  if (/^Highlight/i.test(L)) return "hl";
  if (/^Bronzer/i.test(L)) return "contour";
  if (/^Má/i.test(L)) return "blush";
  if (/^Viền môi/i.test(L)) return "lipOuter";
  if (/^Môi/i.test(L)) return "lip";

  if (/^Tàn nhang/i.test(L)) return "freckles";

const SLOT_CAT = { rim: "mat", liner: "mat", lid: "mat", shimmer: "hl", hl: "hl", contour: "khoi", blush: "ma", lipOuter: "son", lip: "son", base: "nen" };

function original(look) {

    if (!s || seen[s]) return; seen[s] = 1;
    if (s === "rim") { o.lid.depth = h; if (!o.lid.lowerLash || o.lid.lowerLash === "none") o.lid.lowerLash = "full"; }
    if (s === "liner") o.liner = Object.assign({}, o.liner, { hex: h });

// Palette roles the face drawing can place; anything else stays in the swatch list only.
const CAT_ROLE = { lip: "lip", lips: "lip", blush: "blush", cheek: "blush", cheeks: "blush", "eye-main": "main", eyes: "main", eye: "main", lid: "main", "eye-depth": "depth", liner: "liner", shimmer: "shimmer", highlight: "hl", bronzer: "contour" };
const catEntry = id => CATALOG.find(e => e.id === id);

// Draws the entry's own colours on the profile's bare face. Reference looks and entries with nothing drawable get null.
function catDiagram(e) {
  if (e.fit === "Tham khảo" || e.kind === "traditional") return null;
  const dg = { skin: PC.skin.hex, brow: {}, lid: {}, blush: {}, contour: {}, highlight: {}, lips: {} }, seen = {};
  e.det.p.forEach(p => {
    const h = catHex(p[0]), r = CAT_ROLE[p[2]];
    if (!h || !r || seen[r]) return;
    seen[r] = 1;
    if (r === "main") dg.lid.main = h;
    if (r === "depth") { dg.lid.depth = h; dg.lid.lowerLash = "full"; }
    if (r === "liner") dg.liner = { hex: h, style: "short-wing" };
    if (r === "shimmer") dg.lid.shimmer = h;
    if (r === "hl") dg.highlight = { hex: h, finish: "matte", areas: ["nose-bridge"] };
    if (r === "contour") dg.contour = { hex: h, areas: ["cheek-hollow", "jaw"] };
    if (r === "blush") dg.blush = { hex: h, shape: "horizontal-mid-cheek", intensity: .42 };
    if (r === "lip") { dg.lips.color = h; dg.lips.outer = null; }

const SCREENS = { today: scrToday, palette: scrPalette, layout: scrLayout, detail: scrDetail, catdetail: scrCatDetail, skin: scrSkin, profile: scrProfile };

function render(keepScroll) {

// The hash mirrors the screen so a reload or a shared link lands in the same place: #screen.flag.flag
function syncHash() {
  const cur = state.overlay === "shop" ? (SHOPST.tab === "inv" ? "inventory" : "shopping") : state.overlay === "checker" ? "checker" : state.screen;
  const flags = [LANG === "en" ? "en" : "", state.screen === "detail" ? "look-" + state.lookId : state.screen === "catdetail" ? "cat-" + state.catId : ""].filter(Boolean);
  try { history.replaceState(null, "", "#" + [cur].concat(flags).join(".")); } catch (e) { /* file:// in some browsers */ }
}
function refresh() { renderOverlay(); syncHash(); renderShell(); }
function go(where) {
  state.overlay = null;
  if (where === "checker") { state.screen = state.screen || "palette"; state.overlay = "checker"; }
  else if (where === "shopping" || where === "inventory") { if (!SCREENS[state.screen]) state.screen = "today"; state.overlay = "shop"; SHOPST.tab = where === "inventory" ? "inv" : "need"; SHOPST.form = null; }
  else state.screen = where;

}
let toastT;
function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("on"), 2200);
}
function download(name, text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "application/json" })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
// The profile as the app sees it now (baked-in or imported, plus edits), so an export reloads to the same state.

function importProfile(text) {
  const obj = JSON.parse(text);
  if (!isObj(obj)) throw new Error("not a JSON object");
  if (!isObj(obj.colors) || !obj.colors.skin || !normHex(obj.colors.skin.hex)) throw new Error("colors.skin.hex");
  store.set("profile.import", obj); store.del("profile.edits");
  location.reload();
}
function copyList() {
  const lines = PLAN.map((p, i) => `${i + 1}. ${pickName(p)} ${pickHexes(p).join(" ")}`).concat(SHOPST.manual.map(m => `+ ${m.name}${m.hex ? " " + m.hex : ""}`));
  const text = lines.join("\n");
  const done = () => toast(t("toast.copied", { n: shopCount() }));

$("#app").addEventListener("click", e => {
  const btn = e.target.closest("button, [data-close], summary");
  if (!btn || btn.tagName === "SUMMARY") return;
  const d = btn.dataset;
  if (d.close !== undefined) { state.overlay = null; refresh(); return; }
  if (d.look) { state.lookId = d.look; state.done = new Set(); state.screen = "detail"; state.overlay = null; render(); return; }
  if (d.lib) {
    if (LOOK[d.lib]) { state.lookId = d.lib; state.done = new Set(); state.screen = "detail"; state.overlay = null; render(); }
    else if (catEntry(d.lib)) { state.catId = d.lib; state.screen = "catdetail"; state.overlay = null; render(); }
    else toast(t("toast.noDetail"));
    return;
  }
  if (d.nextPick !== undefined) { state.pick++; render(true); return; }
  if (d.go) { if (d.cat) state.cat = d.cat; state.screen = d.go; state.overlay = null; render(); return; }
  if (d.open) { state.overlay = d.open; refresh(); return; }
  if (d.checkHex) { state.checkHex = d.checkHex; state.checkCat = d.checkCat || state.checkCat; state.overlay = "checker"; refresh(); return; }
  if (d.ckCat) { state.checkCat = d.ckCat; state.ckName = null; state.ckLined = false; renderOverlay(); return; }
  if (pcClick(d)) return;
  if (d.cat) { state.cat = d.cat; render(true); return; }
  if (d.occ) { state.occ = d.occ; render(true); return; }
  if (d.kind) { state.kind = d.kind; document.querySelectorAll(".kind-tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.kind === state.kind)); applyLib(); return; }
  if (d.filter) { state.filters.has(d.filter) ? state.filters.delete(d.filter) : state.filters.add(d.filter); btn.setAttribute("aria-pressed", state.filters.has(d.filter)); applyLib(); return; }
  if (d.done !== undefined) { const i = +d.done; state.done.has(i) ? state.done.delete(i) : state.done.add(i); render(true); return; }
  if (d.rtick !== undefined) { toggleStep(d.rtick); render(true); return; }
  if (d.remove !== undefined) { SHOPST.manual.splice(+d.remove, 1); saveShop(); refresh(); return; }
  if (d.lang) { LANG = d.lang; render(true); return; }
  if (d.clim) { LOC.climate = d.clim; saveLoc(LOC); render(true); return; }
  if (d.deflang) { saveDefaultLang(d.deflang); state.defLang = d.deflang; LANG = d.deflang; render(true); toast(t("set.saved")); return; }
  if (d.export !== undefined) { download("openmakeup-profile.json", exportProfile()); toast(t("set.exported")); return; }
  if (d.reset !== undefined) {
    if (confirm(t("set.resetAsk"))) { store.del("profile.import"); store.del("profile.edits"); location.reload(); }
    return;
  }
  if (d.shopTab) { SHOPST.tab = d.shopTab; SHOPST.form = d.edit ? "edit" + d.edit : null; state.overlay = "shop"; refresh(); if (d.edit) scrollForm(); return; }
  if (d.openInv) { SHOPST.tab = "inv"; SHOPST.form = "edit" + d.openInv; state.overlay = "shop"; refresh(); scrollForm(); return; }
  if (d.edit) { SHOPST.form = SHOPST.form === "edit" + d.edit ? null : "edit" + d.edit; renderOverlay(); return; }
  if (d.editStars !== undefined) { SHOPST.editStars = !SHOPST.editStars; renderOverlay(); return; }
  if (d.star) {
    const on = !SHOPST.starred.has(d.star);
    on ? SHOPST.starred.add(d.star) : SHOPST.starred.delete(d.star);
    saveShop(); recompute(); render(true);
    if (d.starAdd !== undefined || state.overlay !== "shop") toast(t(on ? "toast.star" : "toast.unstar", { n: GAPS[d.star].need.length, name: lkName(d.star) }));
    return;

  if (d.buy !== undefined) { SHOPST.form = SHOPST.form === "buy" + d.buy ? null : "buy" + d.buy; renderOverlay(); return; }
  if (d.formClose !== undefined) { SHOPST.form = null; renderOverlay(); return; }
  if (d.buySave !== undefined) {
    const before = readyIds();
    buy(PLAN[+d.buySave], formColors());
    const now = readyIds().filter(id => !before.includes(id));
    toast(now.length ? t("toast.boughtReady", { names: names(now, 4) }) : t("toast.bought"));
    return;
  }
  if (d.editSave) {
    setColor(d.editSave, formColors());

    return;
  }
  if (d.addItem !== undefined) { SHOPST.tab = "inv"; SHOPST.form = SHOPST.form === "add" ? null : "add"; renderOverlay(); return; }
  if (d.addSave !== undefined) {

  if (d.add) {
    const name = d.add;
